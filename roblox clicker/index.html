<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Roblox 3D Tycoon Pro</title>
    <!-- Telegram Web App SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Three.js и загрузчики -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            -webkit-tap-highlight-color: transparent;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100%;
            height: 100%;
            height: 100dvh;
            overflow: hidden;
            background: #0b0e14;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            color: #fff;
            touch-action: none;
            overscroll-behavior: none;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .game-card {
            width: 100%;
            max-width: 420px;
            height: 100%;
            height: 100dvh;
            background: #0b0e14;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            position: relative;
            overflow: hidden;
        }

        /* 1. ПАНЕЛЬ СТАТИСТИКИ (НЕОН-СТИЛЬ) */
        .stats-panel {
            background: rgba(22, 27, 38, 0.9);
            border: 1px solid rgba(0, 242, 254, 0.2);
            padding: 12px 14px;
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            flex-shrink: 0;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4), inset 0 1px 1px rgba(255, 255, 255, 0.05);
        }

        .stats-main-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .cash-box {
            display: flex;
            flex-direction: column;
        }

        .cash-label {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #7f8c8d;
            font-weight: 700;
        }

        .cash-display {
            font-size: 26px;
            font-weight: 900;
            color: #00e676;
            text-shadow: 0 0 12px rgba(0, 230, 118, 0.35);
        }

        .income-badges {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 2px;
        }

        .badge-rate {
            font-size: 11px;
            font-weight: 700;
            padding: 3px 8px;
            border-radius: 8px;
            background: rgba(0, 242, 254, 0.1);
            color: #00f2fe;
            border: 1px solid rgba(0, 242, 254, 0.25);
        }

        .badge-tap {
            font-size: 11px;
            font-weight: 700;
            padding: 3px 8px;
            border-radius: 8px;
            background: rgba(155, 81, 224, 0.1);
            color: #bd00ff;
            border: 1px solid rgba(155, 81, 224, 0.25);
        }

        .level-bar-container {
            width: 100%;
            height: 6px;
            background: #141824;
            border-radius: 6px;
            overflow: hidden;
        }

        .level-bar-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #00f2fe, #4facfe);
            box-shadow: 0 0 8px #00f2fe;
            transition: width 0.3s ease;
        }

        /* 2. ИНТЕРАКТИВНОЕ 3D ОКНО */
        #canvas-container {
            width: 100%;
            height: 33vh;
            border-radius: 18px;
            overflow: hidden;
            background: radial-gradient(circle at center, #192033 0%, #0d111a 100%);
            position: relative;
            cursor: pointer;
            touch-action: none;
            flex-shrink: 0;
            border: 1px solid rgba(0, 242, 254, 0.3);
            box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.9), 0 0 15px rgba(0, 242, 254, 0.1);
        }

        .tap-hint {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(11, 14, 20, 0.75);
            backdrop-filter: blur(6px);
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 11px;
            color: #00f2fe;
            font-weight: 700;
            pointer-events: none;
            z-index: 10;
            border: 1px solid rgba(0, 242, 254, 0.3);
        }

        /* 3. МАГАЗИН УЛУЧШЕНИЙ */
        .shop-header {
            font-size: 11px;
            font-weight: 800;
            color: #8a9bb2;
            text-transform: uppercase;
            letter-spacing: 1px;
            padding: 0 2px;
            flex-shrink: 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .shop-panel {
            background: rgba(22, 27, 38, 0.7);
            padding: 8px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            flex: 1;
            overflow-y: auto;
            touch-action: pan-y;
            display: flex;
            flex-direction: column;
            gap: 8px;
            -webkit-overflow-scrolling: touch;
        }

        .shop-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #141824;
            padding: 10px 12px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.03);
            flex-shrink: 0;
            transition: border-color 0.2s;
        }

        .shop-item-info {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .shop-item-top {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .shop-item-title {
            font-size: 13px;
            font-weight: 700;
            color: #f1f2f6;
        }

        .item-lvl-badge {
            font-size: 9px;
            font-weight: 800;
            padding: 1px 6px;
            border-radius: 6px;
            background: rgba(0, 242, 254, 0.15);
            color: #00f2fe;
        }

        .shop-item-gain {
            font-size: 11px;
            color: #4cd137;
            font-weight: 600;
        }

        .shop-item-cost {
            font-size: 11px;
            color: #a4b0be;
            font-weight: 500;
        }

        .shop-item-btn {
            padding: 9px 14px;
            background: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%);
            border: none;
            border-radius: 10px;
            color: #000;
            font-size: 12px;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 2px 10px rgba(0, 242, 254, 0.25);
            transition: transform 0.1s, opacity 0.2s;
        }

        .shop-item-btn:active {
            transform: scale(0.95);
        }

        .shop-item-btn:disabled {
            background: #252b3b;
            color: #57606f;
            box-shadow: none;
            cursor: not-allowed;
            transform: none;
        }

        .reset-btn {
            background: rgba(231, 76, 60, 0.15);
            color: #e74c3c;
            border: 1px solid rgba(231, 76, 60, 0.3);
            padding: 4px 10px;
            border-radius: 8px;
            font-size: 10px;
            font-weight: bold;
            cursor: pointer;
        }

        .floating-text {
            position: absolute;
            font-weight: 900;
            font-size: 24px;
            color: #00e676;
            pointer-events: none;
            animation: floatUp 0.7s ease-out forwards;
            z-index: 100;
            text-shadow: 0 0 10px rgba(0, 230, 118, 0.6);
        }

        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0) scale(1); }
            100% { opacity: 0; transform: translateY(-40px) scale(1.2); }
        }
    </style>
</head>
<body>

<div class="game-card">
    <!-- ПАНЕЛЬ СТАТИСТИКИ -->
    <div class="stats-panel">
        <div class="stats-main-row">
            <div class="cash-box">
                <span class="cash-label">Баланс</span>
                <div class="cash-display" id="cash-val">$0</div>
            </div>
            <div class="income-badges">
                <div class="badge-rate" id="cps-val">+ $0 /сек</div>
                <div class="badge-tap" id="cpc-val">+ $1 /клик</div>
            </div>
        </div>
        <div class="stats-main-row" style="font-size: 11px; color: #a4b0be;">
            <span id="level-val" style="font-weight:700; color:#fff;">Уровень 1</span>
            <span id="xp-val">XP: 0 / 100</span>
        </div>
        <div class="level-bar-container">
            <div class="level-bar-fill" id="xp-fill"></div>
        </div>
    </div>

    <!-- 3D ОКНО -->
    <div id="canvas-container">
        <div class="tap-hint">Тапай по 3D-окну!</div>
    </div>

    <!-- МАГАЗИН -->
    <div class="shop-header">
        <span>Улучшения</span>
        <button class="reset-btn" id="reset-game-btn">Сброс</button>
    </div>
    
    <div class="shop-panel">
        <!-- Клик -->
        <div class="shop-item">
            <div class="shop-item-info">
                <div class="shop-item-top">
                    <span class="shop-item-title">Сила клика</span>
                    <span class="item-lvl-badge" id="lvl-click">Ур. 0</span>
                </div>
                <div class="shop-item-gain" id="gain-click">+1 $/клик</div>
                <div class="shop-item-cost" id="upgrade-click-cost">Цена: $10</div>
            </div>
            <button class="shop-item-btn" id="buy-click-btn">Улучшить</button>
        </div>

        <!-- Авто-рабочий -->
        <div class="shop-item">
            <div class="shop-item-info">
                <div class="shop-item-top">
                    <span class="shop-item-title">Авто-рабочий</span>
                    <span class="item-lvl-badge" id="lvl-auto">Ур. 0</span>
                </div>
                <div class="shop-item-gain" id="gain-auto">+2 $/сек</div>
                <div class="shop-item-cost" id="upgrade-auto-cost">Цена: $25</div>
            </div>
            <button class="shop-item-btn" id="buy-auto-btn">Улучшить</button>
        </div>

        <!-- Супер-клик -->
        <div class="shop-item">
            <div class="shop-item-info">
                <div class="shop-item-top">
                    <span class="shop-item-title">Супер-Клик</span>
                    <span class="item-lvl-badge" id="lvl-super">Ур. 0</span>
                </div>
                <div class="shop-item-gain" id="gain-super">+5 $/клик</div>
                <div class="shop-item-cost" id="upgrade-superclick-cost">Цена: $120</div>
            </div>
            <button class="shop-item-btn" id="buy-superclick-btn">Улучшить</button>
        </div>

        <!-- Фабрика -->
        <div class="shop-item">
            <div class="shop-item-info">
                <div class="shop-item-top">
                    <span class="shop-item-title">Мини-Фабрика</span>
                    <span class="item-lvl-badge" id="lvl-factory">Ур. 0</span>
                </div>
                <div class="shop-item-gain" id="gain-factory">+10 $/сек</div>
                <div class="shop-item-cost" id="upgrade-factory-cost">Цена: $300</div>
            </div>
            <button class="shop-item-btn" id="buy-factory-btn">Улучшить</button>
        </div>
    </div>
</div>

<script>
    // --- ИНИЦИАЛИЗАЦИЯ TELEGRAM MINI APP ---
    const tg = window.Telegram?.WebApp;
    if (tg) {
        tg.ready();
        tg.expand();
        if (tg.enableClosingConfirmation) tg.enableClosingConfirmation();
        if (tg.setHeaderColor) tg.setHeaderColor('#0b0e14');
        if (tg.setBackgroundColor) tg.setBackgroundColor('#0b0e14');
    }

    document.addEventListener('gesturestart', (e) => e.preventDefault());
    document.addEventListener('dblclick', (e) => e.preventDefault());

    function formatNumber(num) {
        if (num < 1000) return num.toString();
        const suffixes = ["", "K", "M", "B", "T", "Qa", "Qi"];
        const i = Math.floor(Math.log10(num) / 3);
        if (i >= suffixes.length) return num.toExponential(2);
        const formatted = (num / Math.pow(10, i * 3)).toFixed(1);
        return (formatted.endsWith('.0') ? formatted.slice(0, -2) : formatted) + suffixes[i];
    }

    // --- АУДИО СИСТЕМА ---
    let audioCtx = null;
    function initAudio() {
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === 'suspended') {
            audioCtx.resume();
        }
    }

    function playSound(type) {
        if (!audioCtx) return;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        const now = audioCtx.currentTime;

        if (type === 'click') {
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(500, now);
            osc.frequency.exponentialRampToValueAtTime(1000, now + 0.07);
            gain.gain.setValueAtTime(1.5, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.07);
            osc.start(now);
            osc.stop(now + 0.07);
        } else if (type === 'buy') {
            osc.type = 'square';
            osc.frequency.setValueAtTime(400, now);
            osc.frequency.exponentialRampToValueAtTime(1100, now + 0.12);
            gain.gain.setValueAtTime(1.2, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.12);
            osc.start(now);
            osc.stop(now + 0.12);
        } else if (type === 'levelup') {
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(400, now);
            osc.frequency.setValueAtTime(650, now + 0.09);
            osc.frequency.setValueAtTime(950, now + 0.18);
            gain.gain.setValueAtTime(1.8, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
            osc.start(now);
            osc.stop(now + 0.4);
        }
    }

    // --- ВИБРАЦИЯ TELEGRAM / BROWSER ---
    function triggerVibration(type = 'light') {
        if (tg && tg.HapticFeedback) {
            if (type === 'medium') tg.HapticFeedback.impactOccurred('medium');
            else if (type === 'heavy') tg.HapticFeedback.impactOccurred('heavy');
            else if (type === 'success') tg.HapticFeedback.notificationOccurred('success');
            else tg.HapticFeedback.impactOccurred('light');
        } else if (navigator && typeof navigator.vibrate === 'function') {
            try { navigator.vibrate(30); } catch (e) {}
        }
    }

    // --- СОСТОЯНИЕ ИГРЫ ---
    const defaultState = {
        cash: 0,
        cps: 0,
        clickPower: 1,
        level: 1,
        xp: 0,
        xpToNext: 100,
        
        // Уровни прокачки
        clickLvl: 0,
        autoLvl: 0,
        superClickLvl: 0,
        factoryLvl: 0,

        // Цены (Снижены стартовые стоимости)
        clickCost: 10,
        autoCost: 25,
        superClickCost: 120,
        factoryCost: 300,
        
        lastSaveTime: Date.now()
    };

    let state = { ...defaultState };
    let scene, camera, renderer, buildingModel, particles = [];

    const particleGeo = new THREE.BoxGeometry(0.3, 0.3, 0.3);
    const particleMat = new THREE.MeshBasicMaterial({ color: 0x00f2fe });

    // Динамические функции расчета прибавок
    function getClickGain() { return 1 + Math.floor(state.clickLvl * 0.4); }
    function getAutoGain() { return 2 + Math.floor(state.autoLvl * 0.8); }
    function getSuperClickGain() { return 5 + Math.floor(state.superClickLvl * 1.5); }
    function getFactoryGain() { return 10 + Math.floor(state.factoryLvl * 3.0); }

    function init3D() {
        const container = document.getElementById('canvas-container');

        scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0d111a);

        camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
        camera.position.set(18, 14, 22);

        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        const ambientLight = new THREE.AmbientLight(0xffffff, 1.2);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0x00f2fe, 2.2);
        dirLight.position.set(10, 20, 15);
        scene.add(dirLight);

        const podiumGeo = new THREE.CylinderGeometry(8, 9, 0.8, 32);
        const podiumMat = new THREE.MeshStandardMaterial({ 
            color: 0x141824, 
            roughness: 0.3,
            metalness: 0.8,
            emissive: 0x00f2fe,
            emissiveIntensity: 0.25
        });
        const podium = new THREE.Mesh(podiumGeo, podiumMat);
        podium.position.y = -0.4;
        scene.add(podium);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.autoRotate = true;
        controls.autoRotateSpeed = 1.2;
        controls.enableZoom = false;

        const loader = new THREE.GLTFLoader();
        loader.load('scene.gltf', (gltf) => {
            buildingModel = gltf.scene;
            const box = new THREE.Box3().setFromObject(buildingModel);
            const center = box.getCenter(new THREE.Vector3());
            buildingModel.position.sub(center);
            scene.add(buildingModel);
            updateModelVisuals();
        }, undefined, () => {
            createFallbackBuilding();
        });

        container.addEventListener('pointerdown', (e) => {
            e.preventDefault();
            handleClick(e);
        });

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            updateParticles();
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
        });
    }

    function createFallbackBuilding() {
        const group = new THREE.Group();
        const geo = new THREE.BoxGeometry(8, 7, 10);
        const mat = new THREE.MeshStandardMaterial({ color: 0x00a8ff, metalness: 0.3 });
        const mesh = new THREE.Mesh(geo, mat);
        mesh.position.y = 3.5;
        group.add(mesh);
        buildingModel = group;
        scene.add(buildingModel);
        updateModelVisuals();
    }

    function create3DParticles() {
        const pCount = 8;
        for (let i = 0; i < pCount; i++) {
            const p = new THREE.Mesh(particleGeo, particleMat);
            p.position.set(0, 3, 0);
            p.userData = {
                vx: (Math.random() - 0.5) * 0.4,
                vy: Math.random() * 0.4 + 0.2,
                vz: (Math.random() - 0.5) * 0.4,
                life: 1.0
            };
            scene.add(p);
            particles.push(p);
        }
    }

    function updateParticles() {
        for (let i = particles.length - 1; i >= 0; i--) {
            const p = particles[i];
            p.position.x += p.userData.vx;
            p.position.y += p.userData.vy;
            p.position.z += p.userData.vz;
            p.userData.vy -= 0.02;
            p.userData.life -= 0.04;
            p.scale.multiplyScalar(0.95);

            if (p.userData.life <= 0) {
                scene.remove(p);
                particles.splice(i, 1);
            }
        }
    }

    function handleClick(event) {
        initAudio();
        const container = document.getElementById('canvas-container');
        const rect = container.getBoundingClientRect();

        state.cash += state.clickPower;
        addXP(2);
        triggerClickAnimation();
        create3DParticles();
        createFloatingText(event.clientX - rect.left, event.clientY - rect.top);
        playSound('click');
        triggerVibration('light');
        updateUI();
        saveGame();
    }

    function addXP(amount) {
        state.xp += amount;
        if (state.xp >= state.xpToNext) {
            state.xp -= state.xpToNext;
            state.level++;
            state.xpToNext = Math.floor(state.xpToNext * 1.4);
            playSound('levelup');
            triggerVibration('success');
            updateModelVisuals();
        }
    }

    function updateModelVisuals() {
        if (!buildingModel) return;
        const scale = 1 + Math.min((state.level - 1) * 0.03, 0.6);
        buildingModel.scale.set(scale, scale, scale);
    }

    function triggerClickAnimation() {
        if (!buildingModel) return;
        const currentScale = 1 + Math.min((state.level - 1) * 0.03, 0.6);
        buildingModel.scale.set(currentScale * 0.93, currentScale * 0.93, currentScale * 0.93);
        setTimeout(() => {
            buildingModel.scale.set(currentScale, currentScale, currentScale);
        }, 80);
    }

    function createFloatingText(x, y) {
        const text = document.createElement('div');
        text.className = 'floating-text';
        text.innerText = `+$${formatNumber(state.clickPower)}`;

        text.style.left = `${x}px`;
        text.style.top = `${y}px`;

        document.getElementById('canvas-container').appendChild(text);
        setTimeout(() => text.remove(), 700);
    }

    // --- ЭЛЕМЕНТЫ UI ---
    const cashEl = document.getElementById('cash-val');
    const cpsEl = document.getElementById('cps-val');
    const cpcEl = document.getElementById('cpc-val');
    const levelEl = document.getElementById('level-val');
    const xpEl = document.getElementById('xp-val');
    const xpFillEl = document.getElementById('xp-fill');
    
    const buyClickBtn = document.getElementById('buy-click-btn');
    const buyAutoBtn = document.getElementById('buy-auto-btn');
    const buySuperClickBtn = document.getElementById('buy-superclick-btn');
    const buyFactoryBtn = document.getElementById('buy-factory-btn');
    const resetBtn = document.getElementById('reset-game-btn');

    // КЛИК УЛУЧШЕНИЕ
    buyClickBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        initAudio();
        if (state.cash >= state.clickCost) {
            state.cash -= state.clickCost;
            state.clickPower += getClickGain();
            state.clickLvl = (state.clickLvl || 0) + 1;
            state.clickCost = Math.floor(state.clickCost * 1.25); // Меньше удорожания (1.25 вместо 1.5)
            playSound('buy');
            triggerVibration('medium');
            updateUI();
            saveGame();
        }
    });

    // АВТО-РАБОЧИЙ
    buyAutoBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        initAudio();
        if (state.cash >= state.autoCost) {
            state.cash -= state.autoCost;
            state.cps += getAutoGain();
            state.autoLvl = (state.autoLvl || 0) + 1;
            state.autoCost = Math.floor(state.autoCost * 1.28); // Меньше удорожания (1.28 вместо 1.6)
            playSound('buy');
            triggerVibration('medium');
            updateUI();
            saveGame();
        }
    });

    // СУПЕР-КЛИК
    buySuperClickBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        initAudio();
        if (state.cash >= state.superClickCost) {
            state.cash -= state.superClickCost;
            state.clickPower += getSuperClickGain();
            state.superClickLvl = (state.superClickLvl || 0) + 1;
            state.superClickCost = Math.floor(state.superClickCost * 1.30); // Меньше удорожания (1.30 вместо 1.7)
            playSound('buy');
            triggerVibration('medium');
            updateUI();
            saveGame();
        }
    });

    // МИНИ-ФАБРИКА
    buyFactoryBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        initAudio();
        if (state.cash >= state.factoryCost) {
            state.cash -= state.factoryCost;
            state.cps += getFactoryGain();
            state.factoryLvl = (state.factoryLvl || 0) + 1;
            state.factoryCost = Math.floor(state.factoryCost * 1.35); // Меньше удорожания (1.35 вместо 1.8)
            playSound('buy');
            triggerVibration('medium');
            updateUI();
            saveGame();
        }
    });

    resetBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        if (confirm("Сбросить весь прогресс?")) {
            localStorage.removeItem('tycoon3d_save');
            state = { ...defaultState, lastSaveTime: Date.now() };
            updateModelVisuals();
            updateUI();
        }
    });

    function updateUI() {
        // Баланс и Потоки
        cashEl.innerText = `$${formatNumber(state.cash)}`;
        cpsEl.innerText = `+ $${formatNumber(state.cps)} /сек`;
        cpcEl.innerText = `+ $${formatNumber(state.clickPower)} /клик`;
        
        // Уровень и XP
        levelEl.innerText = `Уровень ${state.level}`;
        xpEl.innerText = `XP: ${formatNumber(state.xp)} / ${formatNumber(state.xpToNext)}`;
        xpFillEl.style.width = `${Math.min(100, (state.xp / state.xpToNext) * 100)}%`;

        // Бейджи уровней прокачек
        document.getElementById('lvl-click').innerText = `Ур. ${state.clickLvl || 0}`;
        document.getElementById('lvl-auto').innerText = `Ур. ${state.autoLvl || 0}`;
        document.getElementById('lvl-super').innerText = `Ур. ${state.superClickLvl || 0}`;
        document.getElementById('lvl-factory').innerText = `Ур. ${state.factoryLvl || 0}`;

        // Прирост от следующей покупки
        document.getElementById('gain-click').innerText = `+${formatNumber(getClickGain())} $/клик`;
        document.getElementById('gain-auto').innerText = `+${formatNumber(getAutoGain())} $/сек`;
        document.getElementById('gain-super').innerText = `+${formatNumber(getSuperClickGain())} $/клик`;
        document.getElementById('gain-factory').innerText = `+${formatNumber(getFactoryGain())} $/сек`;

        // Цены
        document.getElementById('upgrade-click-cost').innerText = `Цена: $${formatNumber(state.clickCost)}`;
        document.getElementById('upgrade-auto-cost').innerText = `Цена: $${formatNumber(state.autoCost)}`;
        document.getElementById('upgrade-superclick-cost').innerText = `Цена: $${formatNumber(state.superClickCost)}`;
        document.getElementById('upgrade-factory-cost').innerText = `Цена: $${formatNumber(state.factoryCost)}`;

        // Доступность кнопок
        buyClickBtn.disabled = state.cash < state.clickCost;
        buyAutoBtn.disabled = state.cash < state.autoCost;
        buySuperClickBtn.disabled = state.cash < state.superClickCost;
        buyFactoryBtn.disabled = state.cash < state.factoryCost;
    }

    function saveGame() {
        state.lastSaveTime = Date.now();
        localStorage.setItem('tycoon3d_save', JSON.stringify(state));
    }

    function loadGame() {
        const saved = localStorage.getItem('tycoon3d_save');
        if (saved) {
            Object.assign(state, JSON.parse(saved));
            
            if (state.lastSaveTime && state.cps > 0) {
                const now = Date.now();
                const elapsedSec = Math.floor((now - state.lastSaveTime) / 1000);
                if (elapsedSec > 3) {
                    const offlineEarnings = elapsedSec * state.cps;
                    state.cash += offlineEarnings;
                    setTimeout(() => {
                        alert(`С возвращением!\nВы заработали $${formatNumber(offlineEarnings)} за время отсутствия (${elapsedSec} сек)!`);
                    }, 300);
                }
            }
        }
        updateModelVisuals();
        updateUI();
    }

    setInterval(() => {
        if (state.cps > 0) {
            state.cash += state.cps;
            updateUI();
            saveGame();
        }
    }, 1000);

    window.addEventListener('DOMContentLoaded', () => {
        init3D();
        loadGame();
    });
</script>
</body>
</html>
