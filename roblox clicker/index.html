<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Roblox 3D Tycoon Pro</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            -webkit-tap-highlight-color: transparent;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100%;
            height: 100%;
            height: 100dvh;
            overflow: hidden;
            background: #0b0e14;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            color: #fff;
            touch-action: none;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .game-card {
            width: 100%;
            max-width: 420px;
            height: 100%;
            height: 100dvh;
            background: #0b0e14;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            position: relative;
            overflow: hidden;
        }

        /* 1. ПАНЕЛЬ СТАТИСТИКИ */
        .stats-panel {
            background: rgba(22, 27, 38, 0.95);
            border: 1px solid rgba(0, 242, 254, 0.25);
            padding: 12px 14px;
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            flex-shrink: 0;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
        }

        .stats-main-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .cash-box {
            display: flex;
            flex-direction: column;
        }

        .cash-label {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #7f8c8d;
            font-weight: 700;
        }

        .cash-display {
            font-size: 26px;
            font-weight: 900;
            color: #00e676;
            text-shadow: 0 0 12px rgba(0, 230, 118, 0.35);
        }

        .income-badges {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 2px;
        }

        .badge-rate {
            font-size: 11px;
            font-weight: 700;
            padding: 3px 8px;
            border-radius: 8px;
            background: rgba(0, 242, 254, 0.1);
            color: #00f2fe;
            border: 1px solid rgba(0, 242, 254, 0.25);
        }

        .badge-tap {
            font-size: 11px;
            font-weight: 700;
            padding: 3px 8px;
            border-radius: 8px;
            background: rgba(155, 81, 224, 0.1);
            color: #bd00ff;
            border: 1px solid rgba(155, 81, 224, 0.25);
        }

        .level-bar-container {
            width: 100%;
            height: 6px;
            background: #141824;
            border-radius: 6px;
            overflow: hidden;
        }

        .level-bar-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #00f2fe, #4facfe);
            box-shadow: 0 0 8px #00f2fe;
            transition: width 0.3s ease;
        }

        /* 2. ИНТЕРАКТИВНОЕ 3D ОКНО */
        #canvas-container {
            width: 100%;
            height: 36vh;
            min-height: 240px;
            border-radius: 18px;
            overflow: hidden;
            background: #0f141d;
            position: relative;
            cursor: pointer;
            touch-action: none;
            flex-shrink: 0;
            border: 1.5px solid rgba(0, 242, 254, 0.3);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
            transition: border-color 0.3s, box-shadow 0.3s;
        }

        #canvas-container.fever-active {
            border-color: #ff9f1a;
            box-shadow: 0 0 25px rgba(255, 159, 26, 0.6);
            animation: pulseFever 0.5s infinite alternate;
        }

        @keyframes pulseFever {
            from { border-color: #ff9f1a; }
            to { border-color: #ff3838; }
        }

        .fever-badge {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%) scale(0);
            background: linear-gradient(135deg, #ff9f1a, #ff3838);
            color: #fff;
            font-weight: 900;
            font-size: 13px;
            padding: 4px 16px;
            border-radius: 20px;
            box-shadow: 0 0 15px rgba(255, 56, 56, 0.8);
            pointer-events: none;
            z-index: 10;
            transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            letter-spacing: 1px;
        }

        .fever-badge.active {
            transform: translateX(-50%) scale(1);
        }

        /* Шкала Комбо / КД */
        .combo-wrapper {
            position: absolute;
            bottom: 10px;
            left: 12px;
            right: 12px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            pointer-events: none;
        }

        .combo-text-info {
            font-size: 10px;
            font-weight: 800;
            letter-spacing: 0.5px;
            color: #8a9bb2;
            text-align: right;
        }

        .combo-container {
            width: 100%;
            height: 7px;
            background: rgba(0, 0, 0, 0.6);
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.12);
        }

        .combo-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #00f2fe, #ff9f1a, #ff3838);
            transition: width 0.1s linear;
        }

        .combo-fill.cooldown {
            background: #57606f !important;
        }

        /* 3. МАГАЗИН УЛУЧШЕНИЙ */
        .shop-header {
            font-size: 11px;
            font-weight: 800;
            color: #8a9bb2;
            text-transform: uppercase;
            letter-spacing: 1px;
            padding: 0 2px;
            flex-shrink: 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .shop-panel {
            background: rgba(22, 27, 38, 0.75);
            padding: 8px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            flex: 1;
            overflow-y: auto;
            touch-action: pan-y;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .shop-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #141824;
            padding: 10px 12px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            flex-shrink: 0;
        }

        .shop-item-info {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .shop-item-top {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .shop-item-title {
            font-size: 13px;
            font-weight: 700;
            color: #f1f2f6;
        }

        .item-lvl-badge {
            font-size: 9px;
            font-weight: 800;
            padding: 1px 6px;
            border-radius: 6px;
            background: rgba(0, 242, 254, 0.15);
            color: #00f2fe;
        }

        .shop-item-gain {
            font-size: 11px;
            color: #4cd137;
            font-weight: 600;
        }

        .shop-item-cost {
            font-size: 11px;
            color: #a4b0be;
            font-weight: 500;
        }

        .shop-item-btn {
            padding: 9px 14px;
            background: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%);
            border: none;
            border-radius: 10px;
            color: #000;
            font-size: 12px;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 2px 10px rgba(0, 242, 254, 0.25);
            transition: transform 0.1s;
        }

        .shop-item-btn:active { transform: scale(0.95); }
        .shop-item-btn:disabled {
            background: #252b3b;
            color: #57606f;
            box-shadow: none;
            cursor: not-allowed;
            transform: none;
        }

        .reset-btn {
            background: rgba(231, 76, 60, 0.15);
            color: #e74c3c;
            border: 1px solid rgba(231, 76, 60, 0.3);
            padding: 4px 10px;
            border-radius: 8px;
            font-size: 10px;
            font-weight: bold;
            cursor: pointer;
        }

        .floating-text {
            position: absolute;
            font-weight: 900;
            font-size: 24px;
            color: #00e676;
            pointer-events: none;
            animation: floatUp 0.7s ease-out forwards;
            z-index: 100;
            text-shadow: 0 0 10px rgba(0, 230, 118, 0.6);
        }

        .floating-text.fever-text {
            color: #ff9f1a;
            text-shadow: 0 0 12px rgba(255, 159, 26, 0.8);
            font-size: 28px;
        }

        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0) scale(1); }
            100% { opacity: 0; transform: translateY(-40px) scale(1.2); }
        }
    </style>
</head>
<body>

<div class="game-card">
    <div class="stats-panel">
        <div class="stats-main-row">
            <div class="cash-box">
                <span class="cash-label">Баланс</span>
                <div class="cash-display" id="cash-val">$0</div>
            </div>
            <div class="income-badges">
                <div class="badge-rate" id="cps-val">+ $0 /сек</div>
                <div class="badge-tap" id="cpc-val">+ $1 /клик</div>
            </div>
        </div>
        <div class="stats-main-row" style="font-size: 11px; color: #a4b0be;">
            <span id="level-val" style="font-weight:700; color:#fff;">Уровень 1</span>
            <span id="xp-val">XP: 0 / 100</span>
        </div>
        <div class="level-bar-container">
            <div class="level-bar-fill" id="xp-fill"></div>
        </div>
    </div>

    <!-- 3D ОКНО -->
    <div id="canvas-container">
        <div class="fever-badge" id="fever-badge">🔥 FEVER X5! 🔥</div>
        <div class="combo-wrapper">
            <div class="combo-text-info" id="combo-status">Заряд FEVER: 0%</div>
            <div class="combo-container">
                <div class="combo-fill" id="combo-fill"></div>
            </div>
        </div>
    </div>

    <!-- МАГАЗИН -->
    <div class="shop-header">
        <span>Улучшения Базы</span>
        <button class="reset-btn" id="reset-game-btn">Сброс</button>
    </div>
    
    <div class="shop-panel">
        <div class="shop-item">
            <div class="shop-item-info">
                <div class="shop-item-top">
                    <span class="shop-item-title">Сила клика</span>
                    <span class="item-lvl-badge" id="lvl-click">Ур. 0</span>
                </div>
                <div class="shop-item-gain" id="gain-click">+1 $/клик</div>
                <div class="shop-item-cost" id="upgrade-click-cost">Цена: $10</div>
            </div>
            <button class="shop-item-btn" id="buy-click-btn">Улучшить</button>
        </div>

        <div class="shop-item">
            <div class="shop-item-info">
                <div class="shop-item-top">
                    <span class="shop-item-title">Дрон-Рабочий</span>
                    <span class="item-lvl-badge" id="lvl-auto">Ур. 0</span>
                </div>
                <div class="shop-item-gain" id="gain-auto">+2 $/сек</div>
                <div class="shop-item-cost" id="upgrade-auto-cost">Цена: $25</div>
            </div>
            <button class="shop-item-btn" id="buy-auto-btn">Улучшить</button>
        </div>

        <div class="shop-item">
            <div class="shop-item-info">
                <div class="shop-item-top">
                    <span class="shop-item-title">Фонари Базы</span>
                    <span class="item-lvl-badge" id="lvl-super">Ур. 0</span>
                </div>
                <div class="shop-item-gain" id="gain-super">+5 $/клик</div>
                <div class="shop-item-cost" id="upgrade-superclick-cost">Цена: $120</div>
            </div>
            <button class="shop-item-btn" id="buy-superclick-btn">Улучшить</button>
        </div>

        <div class="shop-item">
            <div class="shop-item-info">
                <div class="shop-item-top">
                    <span class="shop-item-title">Мини-Фабрика</span>
                    <span class="item-lvl-badge" id="lvl-factory">Ур. 0</span>
                </div>
                <div class="shop-item-gain" id="gain-factory">+10 $/сек</div>
                <div class="shop-item-cost" id="upgrade-factory-cost">Цена: $300</div>
            </div>
            <button class="shop-item-btn" id="buy-factory-btn">Улучшить</button>
        </div>
    </div>
</div>

<script>
    // --- TELEGRAM SDK ---
    const tg = window.Telegram?.WebApp;
    if (tg) {
        tg.ready();
        tg.expand();
        if (tg.setHeaderColor) tg.setHeaderColor('#0b0e14');
        if (tg.setBackgroundColor) tg.setBackgroundColor('#0b0e14');
    }

    function formatNumber(num) {
        if (num < 1000) return num.toString();
        const suffixes = ["", "K", "M", "B", "T", "Qa"];
        const i = Math.floor(Math.log10(num) / 3);
        if (i >= suffixes.length) return num.toExponential(2);
        const formatted = (num / Math.pow(10, i * 3)).toFixed(1);
        return (formatted.endsWith('.0') ? formatted.slice(0, -2) : formatted) + suffixes[i];
    }

    // --- ВИБРАЦИЯ ---
    function triggerVibration(type = 'heavy') {
        if (tg && tg.HapticFeedback) {
            if (type === 'heavy') tg.HapticFeedback.impactOccurred('heavy');
            else if (type === 'success') tg.HapticFeedback.notificationOccurred('success');
            else if (type === 'medium') tg.HapticFeedback.impactOccurred('medium');
        } else if (navigator && typeof navigator.vibrate === 'function') {
            try { navigator.vibrate(35); } catch (e) {}
        }
    }

    // --- АУДИО ---
    let audioCtx = null;
    function initAudio() {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    function playSound(type) {
        if (!audioCtx) return;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        const now = audioCtx.currentTime;

        if (type === 'click') {
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(500, now);
            osc.frequency.exponentialRampToValueAtTime(1100, now + 0.05);
            gain.gain.setValueAtTime(1.2, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.05);
            osc.start(now); osc.stop(now + 0.05);
        } else if (type === 'gold') {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(800, now);
            osc.frequency.exponentialRampToValueAtTime(1600, now + 0.2);
            gain.gain.setValueAtTime(1.5, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
            osc.start(now); osc.stop(now + 0.2);
        } else if (type === 'buy') {
            osc.type = 'square';
            osc.frequency.setValueAtTime(400, now);
            osc.frequency.exponentialRampToValueAtTime(900, now + 0.08);
            gain.gain.setValueAtTime(0.8, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);
            osc.start(now); osc.stop(now + 0.08);
        }
    }

    // --- СОСТОЯНИЕ ИГРЫ ---
    const defaultState = {
        cash: 0,
        cps: 0,
        clickPower: 1,
        level: 1,
        xp: 0,
        xpToNext: 100,
        clickLvl: 0,
        autoLvl: 0,
        superClickLvl: 0,
        factoryLvl: 0,
        clickCost: 10,
        autoCost: 25,
        superClickCost: 120,
        factoryCost: 300,
        lastSaveTime: Date.now()
    };

    let state = { ...defaultState };
    
    // Переменные FEVER и КД
    let comboVal = 0;
    let isFever = false;
    let feverActiveTimer = 0;   // Длительность режима Fever (4 сек)
    let feverCooldownTimer = 0; // КД 3 минуты (180 сек)

    // Переменные Three.js
    let scene, camera, renderer, baseGroup, platformMesh, gridMesh;
    let mainBuildingMesh, buildingRoofUnit, factoryWingMesh, smokeParticles = [], drones = [], lampsGroup;
    let goldenChest = null;
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();

    function getClickGain() { return 1 + Math.floor(state.clickLvl * 0.4); }
    function getAutoGain() { return 2 + Math.floor(state.autoLvl * 0.8); }
    function getSuperClickGain() { return 5 + Math.floor(state.superClickLvl * 1.5); }
    function getFactoryGain() { return 10 + Math.floor(state.factoryLvl * 3.0); }

    // --- 3D СЦЕНА ---
    function init3D() {
        const container = document.getElementById('canvas-container');

        scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0f141d);

        camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
        camera.position.set(22, 18, 26);

        renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setClearColor(0x0f141d, 1);
        container.appendChild(renderer.domElement);

        // Освещение (устранено пропадание текстур в темноту)
        const hemiLight = new THREE.HemisphereLight(0xffffff, 0x111625, 1.3);
        scene.add(hemiLight);

        const dirLight = new THREE.DirectionalLight(0x00f2fe, 1.8);
        dirLight.position.set(15, 25, 20);
        scene.add(dirLight);

        baseGroup = new THREE.Group();
        scene.add(baseGroup);

        // 1. Одиночная металлическая платформа без наложения слоев (нет Z-fighting)
        const platformGeo = new THREE.BoxGeometry(16, 0.6, 16);
        const platformMat = new THREE.MeshStandardMaterial({ color: 0x181e2b, roughness: 0.5, metalness: 0.6 });
        platformMesh = new THREE.Mesh(platformGeo, platformMat);
        platformMesh.position.y = -0.3;
        baseGroup.add(platformMesh);

        // Четкая неоновая сетка поверх пола
        gridMesh = new THREE.GridHelper(16, 16, 0x00f2fe, 0x243044);
        gridMesh.position.y = 0.01;
        baseGroup.add(gridMesh);

        // 2. Главное здание
        const buildingGroup = new THREE.Group();
        
        const mainGeo = new THREE.BoxGeometry(6, 6, 6);
        const mainMat = new THREE.MeshStandardMaterial({ color: 0x222a38, roughness: 0.3, metalness: 0.4 });
        mainBuildingMesh = new THREE.Mesh(mainGeo, mainMat);
        mainBuildingMesh.position.y = 3; 
        buildingGroup.add(mainBuildingMesh);

        // Окна здания
        const glassGeo = new THREE.BoxGeometry(6.1, 1.0, 4.5);
        const glassMat = new THREE.MeshStandardMaterial({ color: 0x00f2fe, emissive: 0x00f2fe, emissiveIntensity: 0.5 });
        const window1 = new THREE.Mesh(glassGeo, glassMat);
        window1.position.y = 3.5;
        buildingGroup.add(window1);

        // Аккуратный блок вентиляции на крыше (вместо красной полосы)
        const roofGeo = new THREE.BoxGeometry(2, 0.8, 2);
        const roofMat = new THREE.MeshStandardMaterial({ color: 0x3a475a, metalness: 0.8 });
        buildingRoofUnit = new THREE.Mesh(roofGeo, roofMat);
        buildingRoofUnit.position.set(0, 6.4, 0);
        buildingGroup.add(buildingRoofUnit);

        baseGroup.add(buildingGroup);

        // 3. Фабрика (Расширение)
        factoryWingMesh = new THREE.Group();
        const facGeo = new THREE.BoxGeometry(4, 4.5, 4.5);
        const facMat = new THREE.MeshStandardMaterial({ color: 0x2f3640, metalness: 0.7 });
        const facBody = new THREE.Mesh(facGeo, facMat);
        facBody.position.set(5.2, 2.25, 0);
        factoryWingMesh.add(facBody);

        const pipeGeo = new THREE.CylinderGeometry(0.5, 0.6, 3.5);
        const pipeMat = new THREE.MeshStandardMaterial({ color: 0x57606f });
        const pipe = new THREE.Mesh(pipeGeo, pipeMat);
        pipe.position.set(5.2, 5.5, -1);
        factoryWingMesh.add(pipe);

        factoryWingMesh.visible = false;
        baseGroup.add(factoryWingMesh);

        // 4. Фонари
        lampsGroup = new THREE.Group();
        const lampPositions = [[-6.5, -6.5], [6.5, -6.5], [-6.5, 6.5], [6.5, 6.5]];
        lampPositions.forEach(pos => {
            const poleGeo = new THREE.CylinderGeometry(0.12, 0.12, 2.8);
            const poleMat = new THREE.MeshStandardMaterial({ color: 0x485460 });
            const pole = new THREE.Mesh(poleGeo, poleMat);
            pole.position.set(pos[0], 1.4, pos[1]);

            const headGeo = new THREE.SphereGeometry(0.4);
            const headMat = new THREE.MeshBasicMaterial({ color: 0x00f2fe });
            const head = new THREE.Mesh(headGeo, headMat);
            head.position.set(pos[0], 2.8, pos[1]);

            lampsGroup.add(pole);
            lampsGroup.add(head);
        });
        lampsGroup.visible = false;
        baseGroup.add(lampsGroup);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.autoRotate = true;
        controls.autoRotateSpeed = 0.8;
        controls.enableZoom = false;

        container.addEventListener('pointerdown', handleCanvasClick);

        setInterval(spawnGoldenChest, 35000);

        let lastTime = performance.now();
        function animate(currentTime) {
            requestAnimationFrame(animate);
            const dt = (currentTime - lastTime) / 1000;
            lastTime = currentTime;

            controls.update();
            updateSmoke();
            updateDrones();
            updateGoldenChest();
            handleFeverTimers(dt);
            renderer.render(scene, camera);
        }
        animate(performance.now());

        window.addEventListener('resize', () => {
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
        });
    }

    // --- ПРОКАЧКА ПРОСТРАНСТВА И ЗДАНИЯ ---
    function updateModelVisuals() {
        if (!baseGroup) return;

        // 1. Динамическое расширение платформы по уровню (до +60% площади)
        const platformScale = 1 + Math.min((state.level - 1) * 0.05, 0.6);
        platformMesh.scale.set(platformScale, 1, platformScale);
        gridMesh.scale.set(platformScale, 1, platformScale);

        // 2. Увеличение высоты главного здания по уровню
        const heightScale = 1 + Math.min((state.level - 1) * 0.08, 1.2);
        mainBuildingMesh.scale.set(1, heightScale, 1);
        mainBuildingMesh.position.y = 3 * heightScale;
        buildingRoofUnit.position.y = 6 * heightScale + 0.4;

        // 3. Открытие построек
        if (factoryWingMesh) factoryWingMesh.visible = (state.factoryLvl > 0);
        if (lampsGroup) lampsGroup.visible = (state.superClickLvl > 0);

        // Дроны-рабочие
        while (drones.length < Math.min(state.autoLvl, 6)) {
            createDrone();
        }
    }

    function createDrone() {
        const droneGroup = new THREE.Group();
        const bodyGeo = new THREE.BoxGeometry(0.7, 0.35, 0.7);
        const bodyMat = new THREE.MeshBasicMaterial({ color: 0x00f2fe });
        const body = new THREE.Mesh(bodyGeo, bodyMat);
        droneGroup.add(body);

        droneGroup.userData = {
            angle: Math.random() * Math.PI * 2,
            speed: 0.015 + Math.random() * 0.015,
            radius: 7 + Math.random() * 3,
            height: 4 + Math.random() * 3
        };

        baseGroup.add(droneGroup);
        drones.push(droneGroup);
    }

    function updateDrones() {
        drones.forEach(d => {
            d.userData.angle += d.userData.speed;
            d.position.x = Math.cos(d.userData.angle) * d.userData.radius;
            d.position.z = Math.sin(d.userData.angle) * d.userData.radius;
            d.position.y = d.userData.height + Math.sin(d.userData.angle * 2) * 0.4;
        });
    }

    function createSmoke() {
        if (!factoryWingMesh || !factoryWingMesh.visible) return;
        const smokeGeo = new THREE.BoxGeometry(0.25, 0.25, 0.25);
        const smokeMat = new THREE.MeshBasicMaterial({ color: 0x8a9bb2, transparent: true, opacity: 0.5 });
        const p = new THREE.Mesh(smokeGeo, smokeMat);
        p.position.set(5.2, 7.5, -1);
        p.userData = { vy: 0.03, opacity: 0.5 };
        scene.add(p);
        smokeParticles.push(p);
    }

    function updateSmoke() {
        if (Math.random() < 0.15) createSmoke();
        for (let i = smokeParticles.length - 1; i >= 0; i--) {
            const p = smokeParticles[i];
            p.position.y += p.userData.vy;
            p.scale.multiplyScalar(1.015);
            p.userData.opacity -= 0.012;
            p.material.opacity = p.userData.opacity;

            if (p.userData.opacity <= 0) {
                scene.remove(p);
                smokeParticles.splice(i, 1);
            }
        }
    }

    // --- ЗОЛОТОЙ КЕЙС ---
    function spawnGoldenChest() {
        if (goldenChest) return;

        const geo = new THREE.BoxGeometry(1.4, 1.4, 1.4);
        const mat = new THREE.MeshStandardMaterial({ color: 0xff9f1a, emissive: 0xff9f1a, emissiveIntensity: 0.7, metalness: 0.8 });
        goldenChest = new THREE.Mesh(geo, mat);
        goldenChest.position.set((Math.random() - 0.5) * 10, 12, (Math.random() - 0.5) * 10);
        goldenChest.userData = { targetY: 2.5, aliveTime: 0 };
        scene.add(goldenChest);
    }

    function updateGoldenChest() {
        if (!goldenChest) return;
        goldenChest.rotation.y += 0.03;

        if (goldenChest.position.y > goldenChest.userData.targetY) {
            goldenChest.position.y -= 0.08;
        }

        goldenChest.userData.aliveTime += 1;
        if (goldenChest.userData.aliveTime > 600) {
            scene.remove(goldenChest);
            goldenChest = null;
        }
    }

    // --- ЛОГИКА ТАПА И ТАЙМЕРЫ FEVER / КД ---
    function handleCanvasClick(event) {
        initAudio();
        const container = document.getElementById('canvas-container');
        const rect = container.getBoundingClientRect();

        mouse.x = ((event.clientX - rect.left) / container.clientWidth) * 2 - 1;
        mouse.y = -((event.clientY - rect.top) / container.clientHeight) * 2 + 1;

        raycaster.setFromCamera(mouse, camera);

        if (goldenChest) {
            const intersects = raycaster.intersectObject(goldenChest);
            if (intersects.length > 0) {
                const bonus = state.clickPower * 35 + 50;
                state.cash += bonus;
                createFloatingText(event.clientX - rect.left, event.clientY - rect.top, `+$${formatNumber(bonus)} GOLD!`, true);
                playSound('gold');
                triggerVibration('heavy');
                scene.remove(goldenChest);
                goldenChest = null;
                updateUI();
                saveGame();
                return;
            }
        }

        // Обычный тап
        addCombo();
        const currentPower = isFever ? state.clickPower * 5 : state.clickPower;
        state.cash += currentPower;
        addXP(2);

        createFloatingText(event.clientX - rect.left, event.clientY - rect.top, `+$${formatNumber(currentPower)}`, isFever);
        playSound('click');
        triggerVibration('heavy');
        updateUI();
        saveGame();
    }

    function addCombo() {
        if (isFever || feverCooldownTimer > 0) return; // На КД комбо не набирается
        comboVal = Math.min(100, comboVal + 8);
        if (comboVal >= 100) {
            activateFever();
        }
    }

    function handleFeverTimers(dt) {
        const comboFill = document.getElementById('combo-fill');
        const comboStatus = document.getElementById('combo-status');

        if (isFever) {
            feverActiveTimer -= dt;
            const pct = Math.max(0, (feverActiveTimer / 4) * 100);
            comboFill.style.width = `${pct}%`;
            comboStatus.innerText = `🔥 FEVER ОСТАЛОСЬ: ${Math.ceil(feverActiveTimer)}с`;

            if (feverActiveTimer <= 0) {
                isFever = false;
                feverCooldownTimer = 180; // Включение КД на 3 минуты (180 секунд)
                document.getElementById('canvas-container').classList.remove('fever-active');
                document.getElementById('fever-badge').classList.remove('active');
                comboFill.classList.add('cooldown');
            }
        } else if (feverCooldownTimer > 0) {
            feverCooldownTimer -= dt;
            const pct = Math.max(0, (feverCooldownTimer / 180) * 100);
            comboFill.style.width = `${pct}%`;
            
            const mins = Math.floor(feverCooldownTimer / 60);
            const secs = Math.floor(feverCooldownTimer % 60);
            const formattedTime = `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
            comboStatus.innerText = `⏳ КД FEVER: ${formattedTime}`;

            if (feverCooldownTimer <= 0) {
                comboFill.classList.remove('cooldown');
                comboVal = 0;
                comboStatus.innerText = `Заряд FEVER: 0%`;
            }
        } else {
            // Естественное спадание при простое
            if (comboVal > 0) {
                comboVal = Math.max(0, comboVal - dt * 15);
            }
            comboFill.style.width = `${comboVal}%`;
            comboStatus.innerText = `Заряд FEVER: ${Math.floor(comboVal)}%`;
        }
    }

    function activateFever() {
        isFever = true;
        feverActiveTimer = 4; // Длительность Fever — 4 секунды
        comboVal = 0;
        document.getElementById('canvas-container').classList.add('fever-active');
        document.getElementById('fever-badge').classList.add('active');
        triggerVibration('heavy');
        playSound('gold');
    }

    function addXP(amount) {
        state.xp += amount;
        if (state.xp >= state.xpToNext) {
            state.xp -= state.xpToNext;
            state.level++;
            state.xpToNext = Math.floor(state.xpToNext * 1.4);
            triggerVibration('success');
            updateModelVisuals();
        }
    }

    function createFloatingText(x, y, textStr, isFeverText = false) {
        const text = document.createElement('div');
        text.className = `floating-text ${isFeverText ? 'fever-text' : ''}`;
        text.innerText = textStr;
        text.style.left = `${x}px`;
        text.style.top = `${y}px`;
        document.getElementById('canvas-container').appendChild(text);
        setTimeout(() => text.remove(), 700);
    }

    // --- UI И СОХРАНЕНИЯ ---
    const cashEl = document.getElementById('cash-val');
    const cpsEl = document.getElementById('cps-val');
    const cpcEl = document.getElementById('cpc-val');
    const levelEl = document.getElementById('level-val');
    const xpEl = document.getElementById('xp-val');
    const xpFillEl = document.getElementById('xp-fill');
    
    const buyClickBtn = document.getElementById('buy-click-btn');
    const buyAutoBtn = document.getElementById('buy-auto-btn');
    const buySuperClickBtn = document.getElementById('buy-superclick-btn');
    const buyFactoryBtn = document.getElementById('buy-factory-btn');

    buyClickBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        if (state.cash >= state.clickCost) {
            state.cash -= state.clickCost;
            state.clickPower += getClickGain();
            state.clickLvl = (state.clickLvl || 0) + 1;
            state.clickCost = Math.floor(state.clickCost * 1.25);
            playSound('buy'); triggerVibration('medium'); updateUI(); saveGame();
        }
    });

    buyAutoBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        if (state.cash >= state.autoCost) {
            state.cash -= state.autoCost;
            state.cps += getAutoGain();
            state.autoLvl = (state.autoLvl || 0) + 1;
            state.autoCost = Math.floor(state.autoCost * 1.28);
            playSound('buy'); triggerVibration('medium'); updateModelVisuals(); updateUI(); saveGame();
        }
    });

    buySuperClickBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        if (state.cash >= state.superClickCost) {
            state.cash -= state.superClickCost;
            state.clickPower += getSuperClickGain();
            state.superClickLvl = (state.superClickLvl || 0) + 1;
            state.superClickCost = Math.floor(state.superClickCost * 1.30);
            playSound('buy'); triggerVibration('medium'); updateModelVisuals(); updateUI(); saveGame();
        }
    });

    buyFactoryBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        if (state.cash >= state.factoryCost) {
            state.cash -= state.factoryCost;
            state.cps += getFactoryGain();
            state.factoryLvl = (state.factoryLvl || 0) + 1;
            state.factoryCost = Math.floor(state.factoryCost * 1.35);
            playSound('buy'); triggerVibration('medium'); updateModelVisuals(); updateUI(); saveGame();
        }
    });

    document.getElementById('reset-game-btn').addEventListener('click', (e) => {
        e.stopPropagation();
        if (confirm("Сбросить весь прогресс?")) {
            localStorage.removeItem('tycoon3d_save');
            state = { ...defaultState, lastSaveTime: Date.now() };
            updateModelVisuals();
            updateUI();
        }
    });

    function updateUI() {
        cashEl.innerText = `$${formatNumber(state.cash)}`;
        cpsEl.innerText = `+ $${formatNumber(state.cps)} /сек`;
        cpcEl.innerText = `+ $${formatNumber(state.clickPower * (isFever ? 5 : 1))} /клик`;
        
        levelEl.innerText = `Уровень ${state.level}`;
        xpEl.innerText = `XP: ${formatNumber(state.xp)} / ${formatNumber(state.xpToNext)}`;
        xpFillEl.style.width = `${Math.min(100, (state.xp / state.xpToNext) * 100)}%`;

        document.getElementById('lvl-click').innerText = `Ур. ${state.clickLvl || 0}`;
        document.getElementById('lvl-auto').innerText = `Ур. ${state.autoLvl || 0}`;
        document.getElementById('lvl-super').innerText = `Ур. ${state.superClickLvl || 0}`;
        document.getElementById('lvl-factory').innerText = `Ур. ${state.factoryLvl || 0}`;

        document.getElementById('gain-click').innerText = `+${formatNumber(getClickGain())} $/клик`;
        document.getElementById('gain-auto').innerText = `+${formatNumber(getAutoGain())} $/сек`;
        document.getElementById('gain-super').innerText = `+${formatNumber(getSuperClickGain())} $/клик`;
        document.getElementById('gain-factory').innerText = `+${formatNumber(getFactoryGain())} $/сек`;

        document.getElementById('upgrade-click-cost').innerText = `Цена: $${formatNumber(state.clickCost)}`;
        document.getElementById('upgrade-auto-cost').innerText = `Цена: $${formatNumber(state.autoCost)}`;
        document.getElementById('upgrade-superclick-cost').innerText = `Цена: $${formatNumber(state.superClickCost)}`;
        document.getElementById('upgrade-factory-cost').innerText = `Цена: $${formatNumber(state.factoryCost)}`;

        buyClickBtn.disabled = state.cash < state.clickCost;
        buyAutoBtn.disabled = state.cash < state.autoCost;
        buySuperClickBtn.disabled = state.cash < state.superClickCost;
        buyFactoryBtn.disabled = state.cash < state.factoryCost;
    }

    function saveGame() {
        state.lastSaveTime = Date.now();
        localStorage.setItem('tycoon3d_save', JSON.stringify(state));
    }

    function loadGame() {
        const saved = localStorage.getItem('tycoon3d_save');
        if (saved) {
            Object.assign(state, JSON.parse(saved));
            if (state.lastSaveTime && state.cps > 0) {
                const elapsedSec = Math.floor((Date.now() - state.lastSaveTime) / 1000);
                if (elapsedSec > 3) {
                    const offlineEarnings = elapsedSec * state.cps;
                    state.cash += offlineEarnings;
                }
            }
        }
        updateModelVisuals();
        updateUI();
    }

    setInterval(() => {
        if (state.cps > 0) {
            state.cash += state.cps;
            updateUI();
            saveGame();
        }
    }, 1000);

    window.addEventListener('DOMContentLoaded', () => {
        init3D();
        loadGame();
    });
</script>
</body>
</html>
